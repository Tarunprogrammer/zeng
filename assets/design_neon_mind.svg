<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Glow filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#7F00FF" />
    </linearGradient>
  </defs>

  <!-- Abstract Geometry -->
  <g filter="url(#neon-glow)" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer hexagon -->
    <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" stroke="url(#neon-grad)" />
    
    <!-- Inner lines -->
    <polygon points="100,50 145,75 145,125 100,150 55,125 55,75" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
    
    <!-- Center symbol: stylized infinity/waves -->
    <path d="M 70,100 C 70,80 90,80 100,100 C 110,120 130,120 130,100 C 130,80 110,80 100,100 C 90,120 70,120 70,100 Z" stroke="url(#neon-grad)" stroke-width="5" />
  </g>
  
  <text x="100" y="145" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="4" filter="url(#neon-glow)">FUTURE</text>
</svg>
