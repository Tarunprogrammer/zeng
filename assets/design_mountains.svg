<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background circular clip -->
  <defs>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="80" />
    </clipPath>
  </defs>
  
  <g clip-path="url(#circle-clip)">
    <!-- Sky background -->
    <rect width="200" height="200" fill="#0F2027" />
    
    <!-- Stars -->
    <circle cx="50" cy="60" r="1" fill="#FFF" opacity="0.8"/>
    <circle cx="75" cy="45" r="1.5" fill="#FFF" opacity="0.6"/>
    <circle cx="130" cy="50" r="1" fill="#FFF" opacity="0.7"/>
    <circle cx="150" cy="70" r="1" fill="#FFF" opacity="0.5"/>
    <circle cx="90" cy="80" r="1" fill="#FFF" opacity="0.9"/>
    
    <!-- Moon -->
    <circle cx="140" cy="55" r="18" fill="#ECEFF1" />
    <circle cx="132" cy="55" r="18" fill="#0F2027" />
    
    <!-- Mountain Back -->
    <polygon points="40,150 110,60 170,150" fill="#203A43" />
    
    <!-- Mountain Front -->
    <polygon points="10,160 80,80 150,160" fill="#2C5364" />
    <polygon points="80,80 115,120 80,160" fill="#3a6f87" /> <!-- mountain shading -->

    <!-- Trees -->
    <polygon points="40,160 47,140 54,160" fill="#1b4d3e" />
    <polygon points="43,145 47,133 51,145" fill="#1b4d3e" />

    <polygon points="60,170 70,140 80,170" fill="#143d31" />
    <polygon points="65,148 70,135 75,148" fill="#143d31" />

    <!-- River/Water -->
    <path d="M 0,160 Q 50,155 100,168 T 200,160 L 200,200 L 0,200 Z" fill="#1A3644" />
  </g>
  <!-- Outer border ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#FF5E3A" stroke-width="4" />
  <text x="100" y="193" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">WILD &amp; FREE</text>
</svg>
